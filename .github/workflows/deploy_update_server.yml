name: 🔄 Deploy Update Server
on:
  workflow_dispatch:
    inputs:
      server_choice:
        type: choice
        default: 'Сервер 1'
        description: Вибір сервера
        options:
          - 'Сервер 1'
          - 'Сервер 2'
    
run-name: Deploy Update Server from '${{ github.ref_name }}' branch
permissions:
  contents: read
jobs:
    pytests:
      uses: ./.github/workflows/pytests.yml
    deploy_update_server:
        needs: pytests
        runs-on: ubuntu-latest
        env:
          SERVER_IP: ${{ inputs.server_choice == 'Сервер 1' && secrets.CLOUD_SERVER_IP || secrets.CLOUD_SERVER_2_IP }}
          SERVER_USER: ${{ inputs.server_choice == 'Сервер 1' && secrets.CLOUD_SERVER_USER || secrets.CLOUD_SERVER_2_USER }}
          SERVER_SSH_KEY: ${{ inputs.server_choice == 'Сервер 1' && secrets.CLOUD_SERVER_SSH_KEY || secrets.CLOUD_SERVER_2_SSH_KEY }}
        steps:
          - name: Redeploy Update Server (bin list)
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ env.SERVER_IP }}
              username: ${{ env.SERVER_USER }}
              key: ${{ env.SERVER_SSH_KEY }}
              script: |
                cd /root/ukraine_alarm_map/deploy/
                git fetch --all
                git switch ${{ github.ref_name }}
                git pull
                bash redeploy_update_server.sh \
                  -m ${{ secrets.CLOUD_REDIS_HOST }} \
                  -pw ${{ secrets.CLOUD_REDIS_PASSWORD }} \
                  -g ${{ secrets.G_TOKEN }}
          - name: Clear unused images
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ env.SERVER_IP }}
              username: ${{ env.SERVER_USER }}
              key: ${{ env.SERVER_SSH_KEY }}
              script: |
                docker image prune -f
