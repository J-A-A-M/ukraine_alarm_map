name: 🌐 Deploy Nginx
on:
  workflow_dispatch:
    inputs:
      server_choice:
        type: choice
        default: 'Сервер 1'
        description: Вибір сервера
        options:
          - 'Сервер 1'
          - 'Сервер 2'

run-name: Deploy Nginx from '${{ github.ref_name }}' branch
permissions:
  contents: read
jobs:
    deploy_nginx:
        runs-on: ubuntu-latest
        env:
          SERVER_IP: ${{ inputs.server_choice == 'Сервер 1' && secrets.CLOUD_SERVER_IP || secrets.CLOUD_SERVER_2_IP }}
          SERVER_USER: ${{ inputs.server_choice == 'Сервер 1' && secrets.CLOUD_SERVER_USER || secrets.CLOUD_SERVER_2_USER }}
          SERVER_SSH_KEY: ${{ inputs.server_choice == 'Сервер 1' && secrets.CLOUD_SERVER_SSH_KEY || secrets.CLOUD_SERVER_2_SSH_KEY }}
        steps:
          - name: Redeploy Nginx
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ env.SERVER_IP }}
              username: ${{ env.SERVER_USER }}
              key: ${{ env.SERVER_SSH_KEY }}
              script: |
                cd /root/ukraine_alarm_map/deploy/
                git fetch --all
                git switch ${{ github.ref_name }}
                git pull
                bash redeploy_nginx.sh \
                  -c ${{ secrets.CLOUD_NGINX_CONFIG }} \
                  -l ${{ secrets.CLOUD_NGINX_LOGS }}
          - name: Clear unused images
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ env.SERVER_IP }}
              username: ${{ env.SERVER_USER }}
              key: ${{ env.SERVER_SSH_KEY }}
              script: |
                docker image prune -f
